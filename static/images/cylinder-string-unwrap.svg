<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 380" role="img" aria-labelledby="title desc">
  <title id="title">圆柱展开后，绕绳变成四条斜线</title>
  <desc id="desc">圆柱侧面展开成宽 4 厘米、长 12 厘米的长方形。四圈绳子变成四条斜线，每圈水平走 4 厘米、竖直走 3 厘米。</desc>
  <rect width="480" height="380" fill="#f8f7f4"/>
  <g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif" fill="#202326">
    <text x="20" y="30" font-size="20" font-weight="700">把圆柱展开，绳子变成斜线</text>
    <text x="20" y="51" font-size="14" fill="#6a6e72">4 圈 = 4 个相同的直角三角形</text>

    <rect x="132" y="80" width="180" height="240" fill="none" stroke="#202326" stroke-width="1.5"/>

    <line x1="132" y1="320" x2="312" y2="260" stroke="#2f5d60" stroke-width="3" stroke-linecap="round"/>
    <line x1="132" y1="260" x2="312" y2="200" stroke="#7faaa7" stroke-width="2" stroke-linecap="round"/>
    <line x1="132" y1="200" x2="312" y2="140" stroke="#7faaa7" stroke-width="2" stroke-linecap="round"/>
    <line x1="132" y1="140" x2="312" y2="80" stroke="#7faaa7" stroke-width="2" stroke-linecap="round"/>

    <line x1="132" y1="260" x2="312" y2="260" stroke="#b3c2bf" stroke-width="1.2" stroke-dasharray="4 4"/>
    <line x1="132" y1="260" x2="132" y2="320" stroke="#b3c2bf" stroke-width="1.2" stroke-dasharray="4 4"/>
    <path d="M132 250 H142 V260" fill="none" stroke="#6a6e72" stroke-width="1"/>

    <text x="222" y="338" font-size="13" fill="#6a6e72" text-anchor="middle">横向一圈：4 cm</text>
    <text x="112" y="202" font-size="13" fill="#6a6e72" text-anchor="middle" transform="rotate(-90 112 202)">木棒长：12 cm</text>
    <text x="318" y="306" font-size="13" fill="#6a6e72">每圈上升 3 cm</text>
    <text x="216" y="286" font-size="13" fill="#2f5d60" text-anchor="middle">斜边 5 cm</text>
    <text x="20" y="370" font-size="13" fill="#6a6e72">展开不改变长度；示意图不按比例</text>
  </g>
</svg>
