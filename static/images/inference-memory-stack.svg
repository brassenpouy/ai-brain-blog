<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" role="img" aria-labelledby="title desc">
  <title id="title">70B BF16 模型在 32 个 4K 请求下的显存构成</title>
  <desc id="desc">权重约 140 GB，KV cache 约 43 GB，激活和框架开销合计约 10 到 20 GB，总显存约 190 到 200 GB。</desc>
  <rect width="480" height="330" fill="#f8f7f4"/>
  <g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif" fill="#202326">
    <text x="20" y="30" font-size="20" font-weight="700">70B BF16，32×4K 的显存账</text>
    <text x="20" y="51" font-size="14" fill="#6a6e72">KV cache 按 BF16；单位按 GB 近似</text>

    <text x="20" y="88" font-size="16">weights</text>
    <rect x="120" y="73" width="210" height="20" rx="4" fill="#2f5d60"/>
    <text x="342" y="88" font-size="16">140 GB</text>

    <text x="20" y="128" font-size="16">KV cache</text>
    <rect x="120" y="113" width="64" height="20" rx="4" fill="#7faaa7"/>
    <text x="196" y="128" font-size="16">43 GB</text>

    <text x="20" y="168" font-size="16">activations</text>
    <rect x="120" y="153" width="14" height="20" rx="4" fill="#b3c2bf"/>
    <text x="146" y="168" font-size="16">5～10 GB</text>

    <text x="20" y="208" font-size="16">overhead</text>
    <rect x="120" y="193" width="14" height="20" rx="4" fill="#ccc6ba"/>
    <text x="146" y="208" font-size="16">5～10 GB</text>

    <line x1="20" y1="240" x2="460" y2="240" stroke="#e4e1d9" stroke-width="1"/>
    <text x="20" y="272" font-size="18" font-weight="650">总计约 190～200 GB</text>
    <text x="20" y="300" font-size="14" fill="#6a6e72">聚合量；4 卡 TP 时按每卡分片计算。</text>
  </g>
</svg>
